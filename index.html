<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストリーミング</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }
    .container {
      max-width: 800px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      font-size: 1rem;
    }
    input[type="text"]:focus {
      outline: 2px solid #38bdf8;
    }
    button {
      padding: 12px 24px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    .status {
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      min-height: 1.25em;
    }
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      margin: 0 auto;
      transition: all 0.3s ease;
    }
    .player-container.shorts {
      max-width: 380px;
      aspect-ratio: 9 / 16;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .creator-credit {
      position: fixed;
      bottom: 16px;
      right: 20px;
      font-size: 0.85rem;
      color: #64748b;
      background-color: rgba(15, 23, 42, 0.8);
      padding: 6px 12px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
      border: 1px solid #334155;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>YouTubeストリーミング</h1>
  <div class="input-group">
    <input type="text" id="ytUrl" placeholder="YouTube動画またはShortsのURLを入力..." value="https://www.youtube.com/watch?v=MFwtpM21wWc">
    <button onclick="loadAndPlay()">読み込む</button>
  </div>
  <div class="status" id="statusText">URLを入力して「読み込む」を押してください</div>
  <div class="player-container" id="playerBox">
    <video id="videoPlayer" controls playsinline></video>
    <audio id="audioPlayer"></audio>
  </div>
</div>

<div class="creator-credit" id="creatorCredit" style="display: none;"></div>

<script>
  const API_ENDPOINT = "https://yt-dlp-api-node.mangandenti.com/api/extract";
  const video = document.getElementById('videoPlayer');
  const audio = document.getElementById('audioPlayer');
  const playerBox = document.getElementById('playerBox');
  const statusText = document.getElementById('statusText');
  const creatorCredit = document.getElementById('creatorCredit');

  async function loadAndPlay() {
    const url = document.getElementById('ytUrl').value.trim();
    if (!url) return;

    statusText.innerText = "ストリームURLを抽出中...";
    video.pause();
    audio.pause();

    try {
      const res = await fetch(`${API_ENDPOINT}?url=${encodeURIComponent(url)}`);
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || "URLの抽出に失敗しました");
      }

      if (data.created_by) {
        creatorCredit.innerText = `Created by: ${data.created_by}`;
        creatorCredit.style.display = 'block';
      }

      if (data.is_shorts) {
        playerBox.classList.add('shorts');
      } else {
        playerBox.classList.remove('shorts');
      }

      video.src = data.video_url;
      audio.src = data.audio_url;
      video.muted = true;

      video.load();
      audio.load();

      setupSync();

      statusText.innerText = "読み込み完了!!!!!!!!";

    } catch (err) {
      statusText.innerText = `エラー: ${err.message}`;
    }
  }

  function setupSync() {
    video.onplay = () => audio.play();
    video.onpause = () => audio.pause();
    
    video.onseeking = () => {
      audio.currentTime = video.currentTime;
    };

    video.ontimeupdate = () => {
      const diff = Math.abs(video.currentTime - audio.currentTime);
      if (diff > 0.15) {
        audio.currentTime = video.currentTime;
      }
    };
  }
</script>

</body>
</html>
